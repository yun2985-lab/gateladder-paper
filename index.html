<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="300"><title>GateLadder 0.9.56 모의테스트 (BTCUSDT)</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>body{font-family:system-ui,sans-serif;background:#f6f8fb;color:#222;margin:0;padding:16px}h1{font-size:20px}.k{display:flex;flex-wrap:wrap;gap:10px}.c{background:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 1px 3px #0001;min-width:120px}.c b{display:block;font-size:20px}
.box{background:#fff;border-radius:10px;padding:12px;margin-top:14px;box-shadow:0 1px 3px #0001;overflow-x:auto}table{border-collapse:collapse;font-size:12px;width:100%}td,th{border-bottom:1px solid #eee;padding:4px 6px;text-align:left;white-space:nowrap}.w{color:#0a8}.l{color:#d33}small{color:#777}</style></head><body>
<h1>GateLadder 0.9.56 BTCUSDT 포워드 모의테스트 <small>(가상 자금 1000 USDT · 실주문 없음 · Binance 공개 시세)</small></h1>
<div id="meta"></div><div class="k" id="kpi"></div>
<div class="box"><h3>가격 (15분봉) · 진입/청산 · 감지된 지지저항선</h3><div id="pc" style="height:420px"></div><div id="snap"></div></div>
<div class="box"><h3>자산 곡선</h3><div id="ec" style="height:250px"></div></div>
<div class="box"><h3>일별 손익</h3><table id="daily"></table></div>
<div class="box"><h3>전략별</h3><table id="strat"></table></div>
<div class="box"><h3>보유 포지션</h3><table id="pos"></table></div>
<div class="box"><h3>거래 내역 (진입 근거 포함, 최신순)</h3><table id="tr"></table></div>
<p><small>단순화한 시뮬레이션이며 앱의 실제 결과와 다를 수 있음. 5분마다 갱신.</small></p>
<script>
const U='https://raw.githubusercontent.com/yun2985-lab/gateladder-paper/data/data.json?t='+Date.now();
const tbl=(id,rows,cols)=>{document.getElementById(id).innerHTML='<tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+(c[2]?c[2](r[c[1]],r):r[c[1]]??'')+'</td>').join('')+'</tr>').join('')};
const pc=v=>`<span class="${v>0?'w':'l'}">${v}</span>`;
const ts=s=>Math.floor(new Date(s.replace(' ','T')+':00+09:00')/1000);
fetch(U).then(r=>r.json()).then(d=>{
document.getElementById('meta').innerHTML=`<small>기간 ${d.start} ~ ${d.end} KST · 마지막 갱신 ${d.updated} KST · BTC ${d.price}</small>`;
const K=[['시작자금',d.initial],['현재 자산',d.equity],['수익률 %',pc(d.ret_pct)],['최대낙폭 %',d.mdd_pct],['청산 거래수',d.trades],['승률 %',d.winrate??'-'],['구출 발동',d.rescues.length],['강제청산',d.liquidated?'발생':'없음'],['보유 포지션',d.positions.length]];
document.getElementById('kpi').innerHTML=K.map(k=>`<div class="c">${k[0]}<b>${k[1]}</b></div>`).join('');
tbl('daily',d.daily,[['날짜','date'],['시작','start'],['종료','end'],['손익 %','pnl_pct',pc],['이익 USDT','gain_usdt'],['손실 USDT','loss_usdt'],['손실 %','loss_pct'],['거래','trades'],['승','wins']]);
tbl('strat',Object.entries(d.by_strategy).map(([k,v])=>({k,...v})),[['전략','k'],['청산수','n'],['승','wins'],['손익 USDT','pnl',pc]]);
tbl('pos',d.positions,[['진입시각','opened'],['전략','strat'],['방향','side'],['진입가','entry'],['수량 BTC','qty'],['근거','info']]);
tbl('tr',[...d.trades_list].reverse(),[['진입','time_in'],['청산','time_out'],['전략','strat'],['방향','side'],['진입가','entry'],['청산가','exit'],['손익 USDT','pnl',pc],['증거금대비 %','pnl_pct_margin',pc],['결과','result'],['청산사유','why'],['진입 근거','info']]);
const s=d.snap||{};document.getElementById('snap').innerHTML=`<small>RSI15 ${s.rsi15??'-'} · RSI1h ${s.rsi60??'-'} · 15m 선: ${(s.lines15||[]).map(l=>l.type+' '+l.level).join(', ')||'없음'} · 1h 선: ${(s.lines60||[]).map(l=>l.type+' '+l.level).join(', ')||'없음'} (삼각형/1분 전략은 미구현)</small>`;
const ch=LightweightCharts.createChart(document.getElementById('pc'),{layout:{background:{color:'#fff'}},timeScale:{timeVisible:true}});
const cs=ch.addCandlestickSeries();cs.setData(d.candles.map(c=>({time:c[0]+32400,open:c[1],high:c[2],low:c[3],close:c[4]})));
[...(s.lines15||[]),...(s.lines60||[])].forEach(l=>cs.createPriceLine({price:l.level,color:l.type=='R'?'#d33':'#0a8',lineStyle:2,title:l.type}));
const m0=d.candles.length?d.candles[0][0]+32400:0,mk=[];
d.trades_list.forEach(t=>{const a=ts(t.time_in)+32400-32400+32400,b=ts(t.time_out)+32400;if(a>=m0)mk.push({time:a-a%900,position:t.side=='L'?'belowBar':'aboveBar',color:'#36c',shape:t.side=='L'?'arrowUp':'arrowDown',text:t.strat});if(b>=m0)mk.push({time:b-b%900,position:'aboveBar',color:t.pnl>0?'#0a8':'#d33',shape:'circle',text:t.why})});
mk.sort((a,b)=>a.time-b.time);cs.setMarkers(mk);
const e=LightweightCharts.createChart(document.getElementById('ec'),{layout:{background:{color:'#fff'}},timeScale:{timeVisible:true}});
const seen=new Set();e.addLineSeries().setData(d.equity_curve.map(x=>({time:ts(x[0])+32400,value:x[1]})).filter(p=>!seen.has(p.time)&&seen.add(p.time)));
}).catch(err=>document.getElementById('meta').innerText='데이터 로드 실패: '+err);
</script></body></html>
